<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06080E" />
    </radialGradient>

    <!-- Border Glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.5" />
    </linearGradient>

    <!-- Logo M Violet Gradient (Matching MHK Brand Logo) -->
    <linearGradient id="mhk-m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Drop Shadow & Neon Glow -->
    <filter id="mhk-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg-glow)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#border-grad)" stroke-width="1.5" fill="none" />

  <!-- Geometric 'M' (Exact MHK Logo Match) -->
  <g transform="translate(5.675, 5) scale(1.35)" filter="url(#mhk-glow)">
    <path
      d="M4 34V6H12.5L19.5 22.5L26.5 6H35V34H27.5V15.5L20.5 31.5H18.5L11.5 15.5V34H4Z"
      fill="url(#mhk-m-grad)"
    />
  </g>

  <!-- Constellation Accent Dot (Top Right) -->
  <circle cx="51.5" cy="14.5" r="2" fill="#E9D5FF" />
  <circle cx="51.5" cy="14.5" r="3.5" stroke="#A855F7" stroke-width="0.8" opacity="0.6" />
</svg>
